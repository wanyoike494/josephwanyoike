<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joseph Wanyoike | Projects</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        
        background-image: linear-gradient(135deg, #a8edea, #fed6e3);

        min-height: 100vh;      /* full viewport height */
        display: flex;
        flex-direction: column;
        margin: 0;
;
    }
    main.container {
        flex: 1;
    }


    /* ================= HEADER ================= */

    .site-header {
        background: #ffffff;
        border-bottom: 1px solid #eee;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .header-content {
        max-width: 1200px;
        margin: auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .site-title {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .site-title span {
        color: #667eea;
    }

    .logo-container {
        text-decoration: none;
        color: inherit;
    }

    .main-nav {
        display: flex;
        gap: 20px;
    }

    .nav-link {
        text-decoration: none;
        font-weight: 500;
        color: #555;
        transition: color 0.2s ease;
    }

    .nav-link:hover {
        color: #667eea;
    }

    /* ================= MAIN ================= */

    .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;

    }

    /* ================= SEARCH ================= */

    .search-container {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
    }

    .search-container input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 1rem;
    }

    .search-container button {
        padding: 12px 20px;
        border: none;
        background: #667eea;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }

    .search-container button:hover {
        background: #5568d9;
    }

    /* ================= FILTER BUTTONS ================= */

    .filter_buttons {
        margin-bottom: 30px;
    }

    .filter_buttons button {
        padding: 10px 18px;
        border-radius: 20px;
        border: 1px solid #ddd;
        background: white;
        cursor: pointer;
        font-weight: 500;
    }

    .filter_buttons button.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
    }

    /* ================= CARDS ================= */

    .filterable_cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
    }

    .card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }

    .card_body {
        padding: 18px;
    }

    .card_title a {
        text-decoration: none;
        color: #222;
        font-size: 1.1rem;
        font-weight: 600;
    }

    .card_title a:hover {
        color: #667eea;
    }

    .card_text {
        margin-top: 10px;
        font-size: 0.95rem;
        color: #555;
        line-height: 1.5;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {
        .header-content {
            flex-direction: column;
            gap: 10px;
        }

        .search-container {
            flex-direction: column;
        }

        .search-container button {
            width: 100%;
        }
    }
    .footer {
            width: 100%;
            position: static;
            bottom: 1em;
            text-align: center;
            font-size: 0.9em;
            color: #150c41;
            margin: 30px;

            text-align: center;
            font-size: 0.9em;
            padding: 20px;
    }

        .footer a {
            color: #1956e3;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
}

        }

        .footer a:hover {
            color: #150c41;
        }

    </style>
</head>

<body>

<header class="site-header">
    <div class="header-content">
        <a href="index.html" class="logo-container">
            <h1 class="site-title">NJW<span>DEV</span></h1>
        </a>

        <nav class="main-nav">
            <a href="#" class="nav-link">Blog</a>
            <a href="#" class="nav-link">About</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="search-container">
        <input type="text" id="searchInput" placeholder="Search projects...">
        <button id="searchButton">Search</button>
    </section>

    <section class="filter_buttons">
        <button class="active" data-name="all">All Projects</button>
    </section>

    <section class="filterable_cards">

        <article class="card" data-name="weatherApp">
            <img src="images/weather app.avif" alt="Weather App">

            <div class="card_body">
                <h3 class="card_title">
                    <a href="Web_Programs/Weather_App/index.html">Weather App</a>
                </h3>
                <p class="card_text">
                    Real-time weather updates and forecasts for any location worldwide.
                </p>
            </div>
        </article>

        <article class="card" data-name="clock">
            <img src="images/DigitalClock.png" alt="Digital Clock">

            <div class="card_body">
                <h3 class="card_title">
                    <a href="Web_Programs/Digital_Clock/index.html">Digital Clock</a>
                </h3>
                <p class="card_text">
                    A clean and minimal digital clock built with JavaScript.
                </p>
            </div>
        </article>

         <article class="card" data-name="PaperRockScissors">
            <img src="images\RockPaperScissors.png" alt="Digital Clock">

            <div class="card_body">
                <h3 class="card_title">
                    <a href="Web_Programs/Digital_Clock/index.html">Paper Rock Scissors</a>
                </h3>
                <p class="card_text">
                    Paper Rock Scissors game.
                </p>
            </div>
        </article>

    </section>

</main>

<footer class="footer">
        <p>
            © <span id="year"></span>
            <a href="https://www.josephwanyoike.com" target="_blank">
                Joseph Wanyoike Njoroge
            </a>
            . All rights reserved.
        </p>
    </footer>

<script>
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const cards = document.querySelectorAll(".card");

    /* 🔍 Search function */
    function searchProjects() {
        const query = searchInput.value.toLowerCase().trim();

        cards.forEach(card => {
            const title = card.querySelector(".card_title").innerText.toLowerCase();
            const description = card.querySelector(".card_text").innerText.toLowerCase();

            if (title.includes(query) || description.includes(query)) {
                card.style.display = "block";
            } else {
                card.style.display = "none";
            }
        });
    }

    /* Click search button */
    searchButton.addEventListener("click", searchProjects);

    /* Live search while typing */
    searchInput.addEventListener("keyup", searchProjects);

</script>
</body>
</html>
