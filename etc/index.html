<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            flex: 1 1 120px;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            background: #667eea;
            color: white;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: #5a6fdc;
            transform: translateY(-2px);
        }

        .reset {
            background: #ff6b6b;
        }

        .reset:hover {
            background: #e85c5c;
        }

        .result {
            margin-top: 15px;
            font-size: 1rem;
        }

        .moves {
            margin-bottom: 8px;
            color: #555;
        }

        .outcome {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .outcome.win { color: #2ecc71; }
        .outcome.lose { color: #e74c3c; }
        .outcome.tie { color: #f39c12; }

        .score {
            font-size: 0.95rem;
            color: #333;
        }

        /* 📱 Mobile tweaks */
        @media (max-width: 400px) {
            h1 {
                font-size: 1.5rem;
            }

            button {
                font-size: 0.9rem;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Rock Paper Scissors</h1>

        <div class="buttons">
            <button onclick="playGame('rock')">✊ Rock</button>
            <button onclick="playGame('paper')">📄 Paper</button>
            <button onclick="playGame('scissors')">✂️ Scissors</button>
            <button class="reset" onclick="resetScore()">Reset</button>
        </div>

        <div class="result">
            <p class="moves"></p>
            <p class="outcome"></p>
            <p class="score"></p>
        </div>
    </div>

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
            Wins: 0,
            Loses: 0,
            Tie: 0
        };

        updateScoreUI();

        function playGame(playerMove) {
            const computerMove = pickComputerMove();
            let result = '';

            if (playerMove === computerMove) {
                result = 'Tie';
            } else if (
                (playerMove === 'rock' && computerMove === 'scissors') ||
                (playerMove === 'paper' && computerMove === 'rock') ||
                (playerMove === 'scissors' && computerMove === 'paper')
            ) {
                result = 'You win';
                score.Wins++;
            } else {
                result = 'You lose';
                score.Loses++;
            }

            if (result === 'Tie') score.Tie++;

            localStorage.setItem('score', JSON.stringify(score));

            document.querySelector('.moves').textContent =
                `You chose ${playerMove}. Computer chose ${computerMove}.`;

            const outcomeEl = document.querySelector('.outcome');
            outcomeEl.textContent = result;
            outcomeEl.className = 'outcome ' +
                (result === 'You win' ? 'win' : result === 'You lose' ? 'lose' : 'tie');

            updateScoreUI();
        }

        function updateScoreUI() {
            document.querySelector('.score').textContent =
                `Wins: ${score.Wins} | Ties: ${score.Tie} | Losses: ${score.Loses}`;
        }

        function resetScore() {
            score = { Wins: 0, Loses: 0, Tie: 0 };
            localStorage.removeItem('score');
            updateScoreUI();

            document.querySelector('.moves').textContent = '';
            document.querySelector('.outcome').textContent = '';
        }

        function pickComputerMove() {
            const moves = ['rock', 'paper', 'scissors'];
            return moves[Math.floor(Math.random() * moves.length)];
        }
    </script>

</body>
</html>
